<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}</style>
<title>Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Figtree:wght@400;500;600&family=Gloock&display=swap">
<style>
  :root {
    --bg: #fbeef0; --surface: #fff8f8; --fg: #3a1626; --muted: #8a5a6a;
    --accent: #c2255c; --accent-ink: #ffffff; --soft: #f7dde4; --line: #efc9d3; --heart: #e58aa5;
    --display: 'Gloock', Georgia, 'Times New Roman', serif;
    --body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --hand: 'Caveat', 'Segoe Script', cursive;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1d0c16; --surface: #2a1220; --fg: #fbe9ee; --muted: #c89aab;
      --accent: #ff6b95; --accent-ink: #2a0a16; --soft: #3a1a2c; --line: #4a2438; --heart: #8f3558;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1d0c16; --surface: #2a1220; --fg: #fbe9ee; --muted: #c89aab;
    --accent: #ff6b95; --accent-ink: #2a0a16; --soft: #3a1a2c; --line: #4a2438; --heart: #8f3558;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; line-height: 1.5;
    min-height: 100vh; padding-block: 28px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
  .hearts span { position: absolute; bottom: -12%; color: var(--heart); opacity: .35; animation: rise linear infinite; }
  @keyframes rise { from { transform: translateY(0) rotate(-8deg); } to { transform: translateY(-120vh) rotate(10deg); } }
  /* Pehla page: koi romantic cheez nahi */
  body.plain .hearts { display: none; }
  body.plain .brand { font-family: var(--body); font-size: 1rem; font-weight: 600; color: var(--muted); }
  .stage { position: relative; z-index: 1; max-width: 30rem; margin: 0 auto; }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .brand { font-family: var(--hand); font-size: 1.6rem; line-height: 1; color: var(--accent); }
  .count { font-size: .85rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .bar { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 4px; transition: width .35s ease; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 22px; padding: 26px 20px 22px; min-width: 0; }
  .card .in { animation: lift .35s ease both; }
  @keyframes lift { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; }
  .q { font-size: 1.65rem; line-height: 1.2; margin-bottom: 8px; }
  .hint { font-family: var(--hand); font-size: 1.25rem; color: var(--muted); margin: 0 0 18px; line-height: 1.2; }
  .rom { font-family: var(--hand); font-size: 1.35rem; color: var(--accent); margin: 0 0 10px; line-height: 1.2; }
  .opts { display: grid; gap: 10px; margin-top: 18px; }
  .opt {
    display: flex; align-items: center; gap: 12px; border: 1.5px solid var(--line); background: var(--surface); color: var(--fg);
    border-radius: 14px; padding: 14px 16px; cursor: pointer; min-width: 0;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .opt:hover { border-color: var(--accent); }
  .opt:active { transform: scale(.99); }
  .opt input { position: absolute; opacity: 0; pointer-events: none; }
  .opt::before {
    content: ""; flex: none; width: 18px; height: 18px; border-radius: 50%;
    border: 2px solid var(--line); background: var(--surface);
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .opt.on { border-color: var(--accent); background: var(--soft); }
  .opt.on::before { border-color: var(--accent); background: var(--accent); box-shadow: inset 0 0 0 3px var(--soft); }
  .opt:focus-within { outline: 3px solid var(--accent); outline-offset: 2px; }
  .opt span { min-width: 0; overflow-wrap: anywhere; }
  .field, select {
    width: 100%; font: inherit; color: var(--fg); background: var(--surface);
    border: 1.5px solid var(--line); border-radius: 14px; padding: 13px 14px; margin-top: 14px;
  }
  select { margin-top: 18px; appearance: auto; }
  textarea.field { min-height: 130px; resize: vertical; }
  .field::placeholder { color: var(--muted); opacity: .8; }
  .field:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
  .sub { margin-top: 16px; }
  .sub[hidden] { display: none !important; }
  .label { display: block; font-size: .85rem; color: var(--muted); margin-top: 16px; }
  .note-box {
    margin-top: 16px; padding: 12px 14px; border-radius: 14px; font-size: .92rem; line-height: 1.5;
    border: 1.5px solid var(--line); background: var(--soft); color: var(--fg);
  }
  .note-box b { color: var(--accent); }
  .note-box.warn { border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .chip { font: inherit; color: var(--fg); background: var(--surface); cursor: pointer; border: 1.5px solid var(--line); border-radius: 999px; padding: 9px 15px; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
  .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .zone { position: relative; height: 240px; margin-top: 20px; }
  .zone .btn { position: absolute; top: 0; }
  .zone .yes { left: 0; width: calc(50% - 6px); }
  .zone .no { left: calc(50% + 6px); width: calc(50% - 6px); transition: left .2s ease, top .2s ease; }
  .zone-note { font-family: var(--hand); font-size: 1.3rem; color: var(--accent); min-height: 1.6rem; margin: 6px 0 0; }
  .btn {
    font: inherit; font-weight: 600; cursor: pointer; text-decoration: none; text-align: center;
    display: inline-block; border-radius: 14px; padding: 13px 20px;
    border: 1.5px solid var(--accent); background: var(--accent); color: var(--accent-ink);
  }
  .btn:hover { filter: brightness(1.06); }
  .btn:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.on { box-shadow: 0 0 0 3px var(--soft), 0 0 0 5px var(--accent); }
  .btn[disabled] { opacity: .4; cursor: not-allowed; filter: none; }
  .nav { display: flex; justify-content: space-between; gap: 12px; margin-top: 20px; }
  .nav .btn { flex: 1; }
  .nav .back[hidden] { display: none !important; }
  .done-lead { font-size: 1rem; color: var(--muted); margin: 8px 0 18px; }
  .status { font-family: var(--hand); font-size: 1.3rem; color: var(--accent); margin: 8px 0 0; min-height: 1.5rem; }
  .love { text-align: center; padding-block: 6px; }
  .love-heart { font-size: 3.4rem; line-height: 1; color: var(--accent); animation: beat 1.4s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  .love .q { margin: 10px 0 14px; }
  .love p { font-size: 1.05rem; line-height: 1.6; margin: 0 0 10px; animation: lift .8s ease both; }
  .love .sign { font-family: var(--hand); font-size: 2rem; color: var(--accent); margin-top: 14px; animation: lift .8s ease both; }
  .burst { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 5; }
  .burst span { position: absolute; bottom: -10%; color: var(--accent); animation: burst-up ease-out both; }
  @keyframes burst-up { from { transform: translateY(0) rotate(-10deg); opacity: 1; } to { transform: translateY(-115vh) rotate(14deg); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) {
    .hearts, .burst { display: none; }
    .card .in, .bar i, .zone .no { animation: none; transition: none; }
    .love-heart, .love p, .love .sign { animation: none; }
  }
</style>
</head>
<body class="plain">
<div class="hearts" id="hearts" aria-hidden="true"></div>
<main class="stage">
  <div class="top">
    <div class="brand" id="brand">Quiz</div>
    <div class="count" id="count">1 / 10</div>
  </div>
  <div class="bar" aria-hidden="true"><i id="bar"></i></div>
  <section class="card" id="card" aria-live="polite"></section>
  <div class="nav" id="nav">
    <button class="btn ghost back" id="back" type="button">Peeche</button>
    <button class="btn" id="next" type="button">Aage</button>
  </div>
</main>

<script>
(function () {
  var LETTERS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
  var SONGS = ['Majaal', 'Sun Ranjheya', 'Kinna Sona', 'Maine Khud Ko'];
  var WHY = ['Dar gharwalo ka', 'Mujhe aap mein interest nahi hai', 'Kisi se baat karti hu'];

  var LOVE_NOTE = [
    'Jo bhi jawab ho, ek baat kabhi nahi badlegi.',
    'Tum mere liye bahut khaas ho.',
    'Tumhari ek muskaan se meri poori thakaan utar jaati hai.',
    'Main intezaar karunga, aur kal tumhare har sawal ka jawab dunga.'
  ];
  var LOVE_SIGN = 'ok bye';

  // Page 2 se aage ki romantic lines (page 1 pe koi nahi)
  var ROM = {
    1: 'Tumhara khayal rakhna mujhe achha lagta hai ♥',
    2: 'Dil ki baat, seedha dil se ♥',
    3: 'Tumse baat karne ka bahana dhoondhta hu ♥',
    4: 'Tumhari har baat mere liye khaas hai ♥',
    5: 'Gaano mein bhi tum hi yaad aati ho ♥',
    6: 'Ye saare gaane tumhare naam ♥',
    7: 'Tumse shikayat nahi, bas tumhe samajhna chahta hu ♥',
    8: 'Tumse baat karke sukoon milta hai ♥',
    9: 'Tumhari baat sunne ko dil betaab hai ♥'
  };

  function burstHearts() {
    var layer = document.createElement('div');
    layer.className = 'burst';
    layer.setAttribute('aria-hidden', 'true');
    for (var b = 0; b < 40; b++) {
      var sp = document.createElement('span');
      sp.textContent = '♥';
      sp.style.left = (Math.random() * 100) + '%';
      sp.style.fontSize = (16 + Math.random() * 30) + 'px';
      sp.style.animationDuration = (3 + Math.random() * 3) + 's';
      sp.style.animationDelay = (Math.random() * 1.5) + 's';
      layer.append(sp);
    }
    document.body.append(layer);
    setTimeout(function () { layer.remove(); }, 8000);
  }
  var state = { i: 0, a: {} };
  var cleanup = null;
  var SHEET_URL = "https://script.google.com/macros/s/AKfycbwvQiDW4t0mRmHo_yDmMaWdqkYueIcjX_XQpFX-ewKti_bBDETKrCoRoFe2BdsgmMHj/exec";
  var KEYS = ['naam_letter', 'khana_khaya', 'pyaar', 'online_baat_kyu_nahi', 'phone_pe_kisse', 'gaana_yaad', 'mere_gaane_pasand', 'block_kyu', 'baat_kaise', 'sawal_ya_baat'];
  function makeSid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
  var SID = makeSid();
  var saveTimer = null;
  function saveToSheet(final) {
    clearTimeout(saveTimer);
    if (!SHEET_URL) return;
    if (!Object.keys(state.a).length && !wrong) return;
    var payload = {
      sessionId: SID,
      time: new Date().toISOString(),
      status: final ? 'completed' : (wrong >= MAX_WRONG ? 'locked' : 'in progress'),
      step: Math.min(state.i + 1, steps.length),
      wrongLetterAttempts: wrong,
      locked: wrong >= MAX_WRONG,
      letter_chuna: state.a.letter || ''
    };
    steps.forEach(function (s, idx) {
      var ok = false;
      try { ok = idx <= state.i && s.valid(); } catch (e) { ok = false; }
      payload[KEYS[idx]] = ok ? s.answer() : '';
    });
    try {
      fetch(SHEET_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      }).catch(function () {});
    } catch (e) {}
  }
  var MAX_WRONG = 3;
  var wrong = 0;
  try { wrong = parseInt(localStorage.getItem('dkb-wrong'), 10) || 0; } catch (e) { wrong = 0; }
  function saveWrong() { try { localStorage.setItem('dkb-wrong', String(wrong)); } catch (e) {} }
  var card = document.getElementById('card');
  var nextBtn = document.getElementById('next');
  var backBtn = document.getElementById('back');
  var navEl = document.getElementById('nav');
  var countEl = document.getElementById('count');
  var barEl = document.getElementById('bar');
  var brandEl = document.getElementById('brand');

  function setRomantic(on) {
    document.body.classList.toggle('plain', !on);
    brandEl.textContent = on ? 'sirf tumhare liye' : 'Quiz';
    document.title = on ? 'Dil Ki Baat' : 'Quiz';
  }

  function el(tag, attrs) {
    var n = document.createElement(tag);
    attrs = attrs || {};
    Object.keys(attrs).forEach(function (k) { n.setAttribute(k, attrs[k]); });
    for (var i = 2; i < arguments.length; i++) {
      var c = arguments[i];
      if (c == null) continue;
      n.append(typeof c === 'string' ? document.createTextNode(c) : c);
    }
    return n;
  }

  function radios(key, opts, onPick) {
    var wrap = el('div', { 'class': 'opts', role: 'radiogroup' });
    opts.forEach(function (o, idx) {
      var id = key + '-' + idx;
      var input = el('input', { type: 'radio', name: key, id: id, value: o });
      input.checked = state.a[key] === o;
      var lab = el('label', { 'for': id, 'class': 'opt' + (input.checked ? ' on' : '') }, input, el('span', {}, o));
      input.addEventListener('change', function () {
        state.a[key] = o;
        wrap.querySelectorAll('.opt').forEach(function (l) {
          l.classList.toggle('on', l.querySelector('input').checked);
        });
        if (onPick) onPick(o);
        update();
      });
      wrap.append(lab);
    });
    return wrap;
  }

  function textField(key, id, placeholder, multi) {
    var f = multi ? el('textarea', { 'class': 'field', id: id, placeholder: placeholder })
                  : el('input', { 'class': 'field', id: id, type: 'text', placeholder: placeholder, autocomplete: 'off' });
    f.value = state.a[key] || '';
    f.addEventListener('input', function () { state.a[key] = f.value.trim(); update(); });
    return f;
  }

  function head(q, hint) {
    var frag = document.createDocumentFragment();
    frag.append(el('h1', { 'class': 'q' }, q));
    if (hint) frag.append(el('p', { 'class': 'hint' }, hint));
    return frag;
  }

  var steps = [
    {
      short: 'Naam ka pehla letter',
      render: function (box) {
        box.append(head('Aapke naam ka pehla letter kya hai?', 'Dropdown se chuno'));
        var sel = el('select', { id: 'letter', 'aria-label': 'Naam ka pehla letter' });
        sel.append(el('option', { value: '' }, 'Letter chuno'));
        LETTERS.forEach(function (l) { sel.append(el('option', { value: l }, l)); });
        sel.value = state.a.letter || '';
        var msg = el('p', { 'class': 'zone-note' });
        function say() {
          msg.textContent = state.a.letter && state.a.letter !== 'N'
            ? 'Ye letter sahi nahi hai. ' + (MAX_WRONG - wrong) + ' koshish bachi hai.' : '';
        }
        sel.addEventListener('change', function () {
          state.a.letter = sel.value;
          if (sel.value === 'N') { wrong = 0; saveWrong(); }
          if (sel.value && sel.value !== 'N') {
            wrong++;
            saveWrong();
            saveToSheet(false);
            if (wrong >= MAX_WRONG) { show(); return; }
          }
          say();
          update();
        });
        box.append(sel, msg);
        say();
      },
      valid: function () { return state.a.letter === 'N'; },
      answer: function () { return state.a.letter; }
    },
    {
      short: 'Khana khaya',
      render: function (box) {
        box.append(head('Aapne khana khaya?'));
        var sub = el('div', { 'class': 'sub' });
        sub.append(el('label', { 'class': 'label', 'for': 'food' }, 'Kya khaya?'));
        sub.append(textField('food', 'food', 'Yahan likho'));
        sub.hidden = state.a.khana !== 'Ha';
        box.append(radios('khana', ['Ha', 'Na'], function (o) { sub.hidden = o !== 'Ha'; }));
        box.append(sub);
      },
      valid: function () { return state.a.khana === 'Na' || (state.a.khana === 'Ha' && !!state.a.food); },
      answer: function () { return state.a.khana === 'Ha' ? 'Ha (' + state.a.food + ')' : state.a.khana; }
    },
    {
      short: 'Kya tum mujhe like karti ho',
      render: function (box) {
        box.append(head('Kya tum mujhe like karti ho'));
        var zone = el('div', { 'class': 'zone' });
        var yes = el('button', { 'class': 'btn yes', type: 'button' }, 'Yes');
        var no = el('button', { 'class': 'btn no', type: 'button' }, 'No');
        var note = el('p', { 'class': 'zone-note' }, state.a.pyaar === 'Yes' ? 'Pata tha mujhe' : '');
        var dodges = 0, px = -999, py = -999;
        if (state.a.pyaar === 'Yes') yes.classList.add('on');
        zone.append(yes, no);
        function move() {
          var z = zone.getBoundingClientRect();
          var y = yes.getBoundingClientRect();
          var w = no.offsetWidth, h = no.offsetHeight;
          var x = 0, t = 0, tries = 0, clash;
          do {
            x = Math.random() * Math.max(0, z.width - w);
            t = Math.random() * Math.max(0, z.height - h);
            var l = x + z.left, tp = t + z.top;
            clash = l < y.right + 8 && l + w > y.left - 8 && tp < y.bottom + 8 && tp + h > y.top - 8;
            if (!clash && px > -999) clash = Math.hypot(l + w / 2 - px, tp + h / 2 - py) < 130;
            tries++;
          } while (clash && tries < 40);
          no.style.left = x + 'px';
          no.style.top = t + 'px';
          dodges++;
          if (state.a.pyaar !== 'Yes') {
            note.textContent = dodges > 4 ? 'No ko pakadna mushkil hai, Yes dabao na' : '';
          }
        }
        function setP(x, y) { if (x != null) { px = x; py = y; } }
        ['pointerenter', 'pointerdown', 'focus'].forEach(function (ev) {
          no.addEventListener(ev, function (e) {
            if (ev === 'pointerdown') e.preventDefault();
            setP(e.clientX, e.clientY);
            move();
          });
        });
        no.addEventListener('touchstart', function (e) {
          e.preventDefault();
          if (e.touches[0]) setP(e.touches[0].clientX, e.touches[0].clientY);
          move();
        }, { passive: false });
        function near(e) {
          var r = no.getBoundingClientRect();
          var dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
          var dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
          if (Math.hypot(dx, dy) < 70) { setP(e.clientX, e.clientY); move(); }
        }
        document.addEventListener('pointermove', near);
        cleanup = function () { document.removeEventListener('pointermove', near); };
        no.addEventListener('click', function (e) { e.preventDefault(); move(); });
        yes.addEventListener('click', function () {
          state.a.pyaar = 'Yes';
          yes.classList.add('on');
          note.textContent = 'Pata tha mujhe';
          update();
        });
        box.append(zone, note);
      },
      valid: function () { return state.a.pyaar === 'Yes'; },
      answer: function () { return state.a.pyaar; }
    },
    {
      short: 'Online baat kyu nahi kar sakte',
      render: function (box) {
        box.append(head('Hum online baat kyu nahi kar sakte?', 'Jo sach hai wahi chuno'));
        box.append(radios('online', WHY));
        box.append(el('label', { 'class': 'label', 'for': 'onlineNote' }, 'Kuch aur batana ho toh yahan likho (zaroori nahi)'));
        box.append(textField('onlineNote', 'onlineNote', 'Yahan likho'));
      },
      valid: function () { return !!state.a.online; },
      answer: function () { return state.a.online + (state.a.onlineNote ? ' (' + state.a.onlineNote + ')' : ''); }
    },
    {
      short: 'Phone pe kisse baat',
      render: function (box) {
        box.append(head('Aur tum phone pe kisse baat karti rahti ho? 😠'));
        box.append(radios('phone', ['Friend', 'Relative', 'Ex', 'Bf']));
        box.append(el('label', { 'class': 'label', 'for': 'phoneNote' }, 'Kuch aur batana ho toh yahan likho (zaroori nahi)'));
        box.append(textField('phoneNote', 'phoneNote', 'Yahan likho'));
      },
      valid: function () { return !!state.a.phone; },
      answer: function () { return state.a.phone + (state.a.phoneNote ? ' (' + state.a.phoneNote + ')' : ''); }
    },
    {
      short: 'Gaana',
      render: function (box) {
        box.append(head('Koi aisa gaana batao jise sunke tum mujhe yaad karti ho, ya yaad nahi karti?'));
        var sub = el('div', { 'class': 'sub' });
        sub.append(el('label', { 'class': 'label', 'for': 'song' }, 'Kaunsa gaana?'));
        sub.append(textField('song', 'song', 'Gaane ka naam likho'));
        sub.hidden = state.a.yaad !== 'Karti hu';
        box.append(radios('yaad', ['Karti hu', 'Yaad nahi karti'], function (o) { sub.hidden = o !== 'Karti hu'; }));
        box.append(sub);
      },
      valid: function () {
        return state.a.yaad === 'Yaad nahi karti' || (state.a.yaad === 'Karti hu' && !!state.a.song);
      },
      answer: function () {
        return state.a.yaad === 'Karti hu' ? 'Karti hu - ' + state.a.song : state.a.yaad;
      }
    },
    {
      short: 'Mere gaanon mein se pasand',
      render: function (box) {
        box.append(head('Mere favourite gaane, jinhe sunke main tumhe yaad karta hu', 'Inme se jo tumhe pasand ho wo chuno (zaroori nahi)'));
        if (!state.a.favs) state.a.favs = [];
        var chips = el('div', { 'class': 'chips' });
        SONGS.forEach(function (s) {
          var c = el('button', { 'class': 'chip' + (state.a.favs.indexOf(s) > -1 ? ' on' : ''), type: 'button', 'aria-pressed': state.a.favs.indexOf(s) > -1 ? 'true' : 'false' }, s);
          c.addEventListener('click', function () {
            var at = state.a.favs.indexOf(s);
            if (at > -1) state.a.favs.splice(at, 1); else state.a.favs.push(s);
            c.classList.toggle('on', at === -1);
            c.setAttribute('aria-pressed', at === -1 ? 'true' : 'false');
          });
          chips.append(c);
        });
        box.append(chips);
      },
      valid: function () { return true; },
      answer: function () { return state.a.favs && state.a.favs.length ? state.a.favs.join(', ') : 'Koi nahi chuna'; }
    },
    {
      short: 'Baar baar block kyu',
      render: function (box) {
        box.append(head('Aap baar baar block kyu karti ho?', 'Jo sach hai wahi chuno'));
        box.append(radios('block', WHY));
        box.append(el('label', { 'class': 'label', 'for': 'blockNote' }, 'Kuch aur batana ho toh yahan likho (zaroori nahi)'));
        box.append(textField('blockNote', 'blockNote', 'Yahan likho'));
      },
      valid: function () { return !!state.a.block; },
      answer: function () { return state.a.block + (state.a.blockNote ? ' (' + state.a.blockNote + ')' : ''); }
    },
    {
      short: 'Is tarah baat karein',
      render: function (box) {
        box.append(head('Kya hum is tarah baat kar sakte hain?'));
        box.append(el('div', { 'class': 'note-box' },
          el('b', {}, 'Ye tarika kaafi safe hai. '),
          '3 bar lagatar galat letter chunne par page hamesha ke liye lock ho jayega aur phir kabhi aage nahi badh payega., ' +
          'kisi aur ko nahi dikhega. Jab chaho bina kisi dar ke “Nahi” chun sakti ho,'
        ));
        box.append(radios('freq', ['Har din', '4 din mein ek baar', 'Har week', 'Nahi']));
      },
      valid: function () { return !!state.a.freq; },
      answer: function () { return state.a.freq; }
    },
    {
      short: 'Sawal ya kuch bolna',
      render: function (box) {
        box.append(head('Aapka koi sawal ya kuch bolna ho toh yahan likh do.', 'Kal main jawab dunga'));
        box.append(textField('note', 'note', 'Yahan likho (khaali chhod sakti ho)', true));
      },
      valid: function () { return true; },
      answer: function () { return state.a.note || '-'; }
    }
  ];

  function buildSummary() {
    var lines = ['Mere jawab:'];
    steps.forEach(function (s, idx) { lines.push((idx + 1) + '. ' + s.short + ': ' + (s.answer() || '-')); });
    return lines.join('\n');
  }

  function update() {
    if (state.i < steps.length) {
      nextBtn.disabled = !steps[state.i].valid();
      clearTimeout(saveTimer);
      saveTimer = setTimeout(function () { saveToSheet(false); }, 1200);
    }
  }

  function show() {
    if (cleanup) { cleanup(); cleanup = null; }
    card.textContent = '';
    var box = el('div', { 'class': 'in' });
    card.append(box);
    if (wrong >= MAX_WRONG) {
      setRomantic(false);
      navEl.hidden = true;
      countEl.textContent = 'Lock';
      barEl.style.width = '0';
      box.append(el('h2', { 'class': 'q' }, 'Ye page ab hamesha ke liye lock ho gaya.'));
      box.append(el('p', { 'class': 'done-lead' }, 'Teen baar galat letter chuna gaya, isliye ab aage kabhi nahi badh sakte.'));
      return;
    }
    if (state.i >= steps.length) { setRomantic(true); showDone(box); return; }
    setRomantic(state.i > 0);
    navEl.hidden = false;
    countEl.textContent = (state.i + 1) + ' / ' + steps.length;
    barEl.style.width = ((state.i + 1) / steps.length * 100) + '%';
    backBtn.hidden = state.i === 0;
    nextBtn.textContent = state.i === steps.length - 1 ? 'Jawab bhejo' : 'Aage';
    steps[state.i].render(box);
    if (state.i > 0 && ROM[state.i] && box.firstChild) {
      box.firstChild.after(el('p', { 'class': 'rom' }, ROM[state.i]));
    }
    update();
    window.scrollTo(0, 0);
  }

  function showDone(box) {
    navEl.hidden = true;
    countEl.textContent = 'Ho gaya';
    barEl.style.width = '100%';
    var love = el('div', { 'class': 'love' });
    love.append(el('div', { 'class': 'love-heart', 'aria-hidden': 'true' }, '♥'));
    love.append(el('h2', { 'class': 'q' }, 'Tumhare jawab mil gaye.'));
    LOVE_NOTE.forEach(function (line, n) {
      var p = el('p', {}, line);
      p.style.animationDelay = (0.5 + n * 0.9) + 's';
      love.append(p);
    });
    var sg = el('div', { 'class': 'sign' }, '— ' + LOVE_SIGN);
    sg.style.animationDelay = (0.5 + LOVE_NOTE.length * 0.9) + 's';
    love.append(sg);
    box.append(love);
    burstHearts();
    window.scrollTo(0, 0);
  }

  nextBtn.addEventListener('click', function () {
    if (!steps[state.i].valid()) return;
    state.i++;
    saveToSheet(state.i >= steps.length);
    show();
  });
  backBtn.addEventListener('click', function () {
    if (state.i > 0) { state.i--; show(); }
  });

  var hearts = document.getElementById('hearts');
  for (var h = 0; h < 14; h++) {
    var s = document.createElement('span');
    s.textContent = '♥';
    s.style.left = (Math.random() * 96) + '%';
    s.style.fontSize = (14 + Math.random() * 26) + 'px';
    s.style.animationDuration = (14 + Math.random() * 16) + 's';
    s.style.animationDelay = (-Math.random() * 24) + 's';
    hearts.append(s);
  }

  show();
})();
</script>
</body>
</html>
